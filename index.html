<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>검 키우기</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <header>
    <div class="header-side"></div>
    <h1>검 키우기</h1>
    <div class="header-side header-right">
      <button id="nickBtn" class="nick-btn" title="닉네임 변경"></button>
      <input id="nickInput" class="nick-input" maxlength="12" hidden>
    </div>
  </header>

  <main>
    <!-- 좌측: 보관함 -->
    <section class="panel storage-panel">
      <h2>보관함</h2>
      <ul id="storageList" class="storage-list"></ul>
      <div id="storageEmpty" class="storage-empty">보관함이 비어 있습니다</div>
    </section>

    <!-- 중앙: 강화 -->
    <section class="forge-panel">
      <div class="action-row">
        <button id="btnEnhance" class="action-btn primary">강화</button>
        <button id="btnSell" class="action-btn">판매</button>
        <button id="btnStore" class="action-btn">보관</button>
      </div>

      <div class="rate-block">
        <div class="rate-label">강화 성공 확률</div>
        <div id="successRate" class="rate-value">-- %</div>
        <div id="costInfo" class="cost-info"></div>
      </div>

      <div class="protect-block">
        <label class="protect-row">
          <input type="checkbox" id="chkDown">
          하락 보호 (<span id="downCost">0</span> 골드)
        </label>
        <label class="protect-row">
          <input type="checkbox" id="chkDest">
          파괴 보호 (<span id="destCost">0</span> 골드)
        </label>
      </div>

      <div id="swordStage" class="sword-stage">
        <div id="swordVisual" class="sword-visual"></div>
        <div id="swordName" class="sword-name"></div>
        <div id="resultMsg" class="result-msg"></div>
      </div>

      <div class="gold-row">보유 골드 <span id="goldAmount" class="gold-amount"></span></div>
    </section>

    <!-- 우측: 랭킹 + 채팅 -->
    <aside class="right-col">
      <section class="panel ranking-panel">
        <div class="ranking-header">
          <h2>골드 랭킹</h2>
          <div class="ranking-tabs" role="tablist" aria-label="골드 랭킹 종류">
            <button id="rankTotalTab" class="ranking-tab active" type="button" role="tab" aria-selected="true">전체 골드</button>
            <button id="rankDailyTab" class="ranking-tab" type="button" role="tab" aria-selected="false">일일 획득</button>
          </div>
        </div>
        <ol id="rankingList" class="ranking-list"></ol>
      </section>

      <section class="panel chat-panel">
        <h2>채팅</h2>
        <div id="chatMessages" class="chat-messages"></div>
        <div id="attachBar" class="attach-bar" hidden>
          <span id="attachChip" class="item-chip"></span>
          <button id="attachRemove" class="attach-remove" title="첨부 취소">&times;</button>
        </div>
        <form id="chatForm" class="chat-form">
          <button type="button" id="btnItemLink" class="item-link-btn" title="장착 중인 검 자랑하기">+</button>
          <input id="chatInput" class="chat-input" maxlength="120" placeholder="메시지 입력..." autocomplete="off" title="관리자 명령어는 여기에 입력하세요.">
          <button type="submit" class="send-btn">전송</button>
        </form>
      </section>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js?v=6"></script>
  <script src="data/swords.js?v=6"></script>
  <script src="js/backend.js?v=6"></script>
  <script src="js/main.js?v=6"></script>
</body>
</html>
